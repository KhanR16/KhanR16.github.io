<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="t d">
<title id="t">Conceptual overview of the contrastive-learning cross-domain recommendation framework</title>
<desc id="d">Review and behaviour signals pass through a BERT behaviour encoder, then contrastive self-supervised autoencoder alignment, then attention-based fusion of shared and domain-specific embeddings, producing personalized target-domain recommendations.</desc>
